# 1. Give your microservice a clear identity for the Config Server lookup
spring.application.name=Api-Gateway

# 2. Add 'optional:' so the application bypasses the strict startup crash if the server is down
spring.config.import=optional:configserver:http://localhost:8888

# 3. Prevent the environment loader from aggressively failing fast during local development
spring.cloud.config.fail-fast=false